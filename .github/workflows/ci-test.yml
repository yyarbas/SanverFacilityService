name: CI/CD — Test-Umgebung

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Astro Build
        run: npm run build
        env:
          SITE_URL: https://www.sanver-facilityservice.de/test/

      - name: Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dist-test
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy → Test-Umgebung
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout (für pipeline/test-env/)
        uses: actions/checkout@v4

      - name: Build-Artefakt laden
        uses: actions/download-artifact@v4
        with:
          name: dist-test
          path: dist/

      - name: SFTP-Deploy via lftp
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }}" \
            -p "${{ secrets.FTP_PORT }}" \
            sftp://${{ secrets.FTP_HOST }} << 'LFTP_SCRIPT'
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose dist/ /htdocs/sanver-facilityservice.de123/test/
          put pipeline/test-env/.htaccess -o /htdocs/sanver-facilityservice.de123/test/.htaccess
          put pipeline/test-env/.htpasswd -o /htdocs/sanver-facilityservice.de123/test/.htpasswd
          LFTP_SCRIPT
