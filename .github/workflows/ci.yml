name: CI — Tests & Qualität

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ── Lighthouse CI ──────────────────────────────────────────
  lighthouse:
    name: Lighthouse Qualitätsprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Astro Build
        run: npm run build

      - name: Lighthouse CI ausführen
        run: npx lhci autorun
