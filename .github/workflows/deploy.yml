name: Deploy → Manitu

on:
  workflow_run:
    workflows: ["CI — Tests & Qualität"]
    types: [completed]
    branches: [main, dev]

jobs:
  deploy:
    name: ${{ github.event.workflow_run.head_branch == 'main' && 'Produktion' || 'Test' }} Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      # ── 1. Code holen ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ── 2. Astro bauen ─────────────────────────────────────
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Astro Build
        run: npm run build

      # ── 3. Ziel-Pfad setzen ────────────────────────────────
      - name: Umgebung konfigurieren
        id: config
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "remote_path=/htdocs/sanver-facilityservice.de123"  >> $GITHUB_OUTPUT
            echo "label=PRODUKTION"                                   >> $GITHUB_OUTPUT
            echo "url=https://www.sanver-facilityservice.de"         >> $GITHUB_OUTPUT
          else
            echo "remote_path=/htdocs/sanver-facilityservice.de123/test" >> $GITHUB_OUTPUT
            echo "label=TEST"                                             >> $GITHUB_OUTPUT
            echo "url=https://www.sanver-facilityservice.de/test/"       >> $GITHUB_OUTPUT
          fi

      # ── 4. .htaccess je nach Branch ────────────────────────
      - name: htaccess setzen
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "dev" ]; then
            cp pipeline/test-env/.htaccess dist/.htaccess
            echo "${{ secrets.TEST_HTPASSWD }}" > dist/.htpasswd
          else
            cp .htaccess dist/.htaccess
          fi

      # ── 5. Upload via SFTP ─────────────────────────────────
      - name: lftp installieren
        run: sudo apt-get install -y lftp

      - name: Upload zu Manitu
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          REMOTE_PATH: ${{ steps.config.outputs.remote_path }}
        run: |
          cat > /tmp/deploy.lftp << EOF
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${FTP_PORT}"
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 5
          open -p ${FTP_PORT} -u ${FTP_USER},${FTP_PASS} sftp://${FTP_HOST}
          mirror --reverse --delete --verbose --exclude=".git" dist/ ${REMOTE_PATH}/
          quit
          EOF

          echo "Verbinde mit ${FTP_HOST}:${FTP_PORT} als ${FTP_USER}..."
          lftp -f /tmp/deploy.lftp

      # ── 6. Zusammenfassung ─────────────────────────────────
      - name: Deploy-Zusammenfassung
        run: |
          echo "## ✅ Deploy erfolgreich" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Umgebung** | ${{ steps.config.outputs.label }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.event.workflow_run.head_branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.event.workflow_run.head_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ steps.config.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Autor** | ${{ github.event.workflow_run.triggering_actor.login }} |" >> $GITHUB_STEP_SUMMARY
