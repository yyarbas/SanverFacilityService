name: CI/CD — Produktion

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Astro Build
        run: npm run build
        env:
          SITE_URL: https://www.sanver-facilityservice.de

      - name: Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy → Produktion
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout (für .htaccess aus Repo-Root)
        uses: actions/checkout@v4

      - name: Build-Artefakt laden
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: SFTP-Deploy via lftp
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASSWORD }}" \
            -p "${{ secrets.FTP_PORT }}" \
            sftp://${{ secrets.FTP_HOST }} << 'LFTP_SCRIPT'
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose dist/ /htdocs/sanver-facilityservice.de123/
          LFTP_SCRIPT
